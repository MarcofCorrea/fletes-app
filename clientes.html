<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FletesApp - Panel de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <header class="bg-blue-900 text-white p-4 text-center">
            <h1 class="text-xl font-bold">📦 Panel de Cliente</h1>
            <p class="text-xs text-blue-200">Solicita y gestiona tus mudanzas</p>
        </header>

        <div id="contenedorAuth" class="flex-1 flex flex-col">
            <div class="flex border-b bg-slate-50 text-sm font-semibold">
                <button type="button" onclick="cambiarTabAuth('login')" id="btnTabLogin" class="flex-1 py-3 text-center border-b-2 border-blue-600 text-blue-600">Iniciar Sesión</button>
                <button type="button" onclick="cambiarTabAuth('registro')" id="btnTabRegistro" class="flex-1 py-3 text-center text-slate-500">Registrarse</button>
            </div>
            <div class="p-4 flex-1 space-y-4">
                <div id="subTabCliente-login" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h2 class="font-semibold text-lg">🔑 Iniciar Sesión</h2>
                    <div class="space-y-3">
                        <input type="email" id="loginClienteEmail" placeholder="Correo electrónico" class="w-full p-2 border rounded-lg text-sm">
                        <input type="password" id="loginClientePassword" placeholder="Contraseña" class="w-full p-2 border rounded-lg text-sm">
                        <button type="button" onclick="ejecutarLoginCliente()" class="w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold">Entrar</button>
                    </div>
                </div>
                <div id="subTabCliente-registro" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3" style="display: none;">
                    <h2 class="font-semibold text-lg">📝 Crear Cuenta de Cliente</h2>
                    <div class="space-y-3">
                        <input type="text" id="regNombre" placeholder="Nombre completo" class="w-full p-2 border rounded-lg text-sm">
                        <input type="text" id="regTelefono" placeholder="Teléfono" class="w-full p-2 border rounded-lg text-sm">
                        <input type="email" id="regEmail" placeholder="Correo electrónico" class="w-full p-2 border rounded-lg text-sm">
                        <input type="password" id="regPassword" placeholder="Contraseña" class="w-full p-2 border rounded-lg text-sm">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-slate-600">Foto DNI Frente:</label>
                            <input type="file" id="regDniFrenteFile" accept=".jpg, .jpeg, .png" class="w-full p-2 border rounded-lg text-xs bg-white">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-slate-600">Foto DNI Dorso:</label>
                            <input type="file" id="regDniDorsoFile" accept=".jpg, .jpeg, .png" class="w-full p-2 border rounded-lg text-xs bg-white">
                        </div>
                        <button type="button" onclick="ejecutarRegistroCliente()" class="w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold">Registrarme</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="vistaDashboardCliente" class="flex-1 flex flex-col" style="display: none;">
            <!-- [Dashboard omitido por brevedad, usa tu código actual] -->
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
            ? "http://localhost:8000" 
            : "https://fletes-app.onrender.com";

        let clienteIdActual = null;
        let datosClienteActual = null;
        // ... (resto de tus funciones JS)
    </script>
</body>
</html>

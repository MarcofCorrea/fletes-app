<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FletesApp - Selecciona tu Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-8 text-center">
        
        <!-- Logo / Encabezado -->
        <div class="space-y-3">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-4xl shadow-lg">
                📦
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">FletesApp</h1>
            <p class="text-xs text-slate-400">La plataforma inteligente para gestionar tus mudanzas y traslados.</p>
        </div>

        <!-- Opciones de selección -->
        <div class="space-y-4 pt-4">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-left">¿Cómo deseas ingresar?</div>
            
            <!-- Botón Cliente -->
            <a href="clientes.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold flex items-center justify-between shadow-lg transition-all transform hover:-translate-y-0.5">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📦</span>
                    <div class="text-left">
                        <div class="text-sm">Soy Cliente</div>
                        <div class="text-[10px] text-blue-200 font-normal">Quiero publicar y coordinar mudanzas</div>
                    </div>
                </div>
                <span class="text-blue-200 text-xl font-bold">›</span>
            </a>

            <!-- Botón Fletero -->
            <a href="fletero.html" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-2xl font-bold flex items-center justify-between shadow-lg transition-all transform hover:-translate-y-0.5 border border-slate-600">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🚚</span>
                    <div class="text-left">
                        <div class="text-sm">Soy Fletero</div>
                        <div class="text-[10px] text-slate-400 font-normal">Quiero ver solicitudes y ofertar viajes</div>
                    </div>
                </div>
                <span class="text-slate-400 text-xl font-bold">›</span>
            </a>
        </div>

        <!-- Pie de página -->
        <div class="text-[11px] text-slate-500 pt-4 border-t border-slate-700/50">
            FletesApp &copy; 2026 - Todos los derechos reservados.
        </div>
    </div>
</body>
</html>

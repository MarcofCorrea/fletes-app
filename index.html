<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FletesApp - Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col">
        
        <!-- Encabezado -->
        <div class="bg-blue-900 text-white p-6 text-center space-y-2">
            <h1 class="text-2xl font-bold">📦 FletesApp</h1>
            <p class="text-xs text-blue-200">La plataforma inteligente para gestionar tus mudanzas y traslados</p>
        </div>

        <!-- Contenido Principal / Opciones -->
        <div class="p-6 space-y-4 flex-1 flex flex-col justify-center">
            <p class="text-sm text-slate-600 text-center mb-2">Selecciona cómo deseas ingresar al sistema:</p>

            <!-- Botón Cliente -->
            <a href="clientes.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl text-center font-semibold shadow-md transition transform active:scale-95 flex items-center justify-center gap-3">
                <span class="text-xl">🏠</span>
                <div>
                    <div class="text-base font-bold">Panel de Cliente</div>
                    <div class="text-xs text-blue-100 font-normal">Publica y gestiona tus mudanzas</div>
                </div>
            </a>

            <!-- Botón Fletero -->
            <a href="fletero.html" class="block w-full bg-slate-900 hover:bg-slate-800 text-white p-4 rounded-xl text-center font-semibold shadow-md transition transform active:scale-95 flex items-center justify-center gap-3">
                <span class="text-xl">🚚</span>
                <div>
                    <div class="text-base font-bold">Panel de Fletero</div>
                    <div class="text-xs text-slate-300 font-normal">Toma solicitudes y realiza traslados</div>
                </div>
            </a>
        </div>

        <!-- Pie de página -->
        <div class="bg-slate-50 p-4 text-center border-t border-slate-100">
            <p class="text-[11px] text-slate-400">© 2026 FletesApp - Todos los derechos reservados</p>
        </div>

    </div>
</body>
</html>

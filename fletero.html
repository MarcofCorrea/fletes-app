<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FletesApp - Panel Fletero</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <header class="bg-slate-900 text-white p-4 text-center">
            <h1 class="text-xl font-bold">🚚 Panel de Fletero</h1>
        </header>

        <!-- SECCIÓN DE AUTENTICACIÓN -->
        <div id="pantallaAuth" class="flex-1 flex flex-col">
            <div class="flex border-b bg-slate-50 text-sm font-semibold">
                <button type="button" onclick="cambiarTabAuth('login')" id="btnTabLogin" class="flex-1 py-3 text-center border-b-2 border-slate-900 text-slate-900">Iniciar Sesión</button>
                <button type="button" onclick="cambiarTabAuth('registro')" id="btnTabRegistro" class="flex-1 py-3 text-center text-slate-500">Registrarse</button>
            </div>
            <div class="p-4 flex-1 space-y-4">
                <div id="subTabFletero-login" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h2 class="font-semibold text-lg">🔑 Iniciar Sesión</h2>
                    <div class="space-y-3">
                        <input type="email" id="loginEmail" placeholder="Correo electrónico" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="password" id="loginPassword" placeholder="Contraseña" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <button onclick="ejecutarLogin()" class="w-full bg-slate-900 text-white p-2 rounded-lg text-sm font-semibold">Entrar</button>
                    </div>
                </div>

                <div id="subTabFletero-registro" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3" style="display: none;">
                    <h2 class="font-semibold text-lg">📝 Crear Cuenta de Fletero</h2>
                    <div class="space-y-3">
                        <input type="text" id="regNombre" placeholder="Nombre completo" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="text" id="regTelefono" placeholder="Teléfono" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="email" id="regEmail" placeholder="Correo electrónico" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="password" id="regPassword" placeholder="Contraseña" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="text" id="regVehiculo" placeholder="Vehículo (Ej: Fiorino, Kangoo)" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <input type="text" id="regPatente" placeholder="Patente (Ej: AB123CD)" class="w-full p-2 border rounded-lg text-sm bg-white">
                        
                        <div class="border-t pt-2 space-y-2">
                            <label class="text-xs font-bold text-slate-700 block">Datos Bancarios para cobros:</label>
                            <input type="text" id="regCbuCvu" placeholder="CBU / CVU" class="w-full p-2 border rounded-lg text-sm bg-white">
                            <input type="text" id="regAlias" placeholder="Alias bancario" class="w-full p-2 border rounded-lg text-sm bg-white">
                            <input type="text" id="regBanco" placeholder="Nombre del banco" class="w-full p-2 border rounded-lg text-sm bg-white">
                        </div>
                        <button onclick="ejecutarRegistroFletero()" class="w-full bg-slate-900 text-white p-2 rounded-lg text-sm font-semibold">Registrarse como Fletero</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANTALLA DASHBOARD -->
        <div id="pantallaDashboard" class="flex-1 flex flex-col" style="display: none;">
            <div class="flex border-b bg-slate-900 text-white text-[11px]">
                <button onclick="cambiarTabDashboard('solicitudes')" id="navSolicitudes" class="flex-1 py-3 text-center border-b-2 border-emerald-400 font-semibold">Solicitudes</button>
                <button onclick="cambiarTabDashboard('traslados')" id="navTraslados" class="flex-1 py-3 text-center">Aprobadas</button>
                <button onclick="cambiarTabDashboard('billetera')" id="navBilletera" class="flex-1 py-3 text-center">Billetera</button>
                <button onclick="cambiarTabDashboard('perfil')" id="navPerfil" class="flex-1 py-3 text-center">Perfil</button>
                <button onclick="cambiarTabDashboard('soporte')" id="navSoporte" class="flex-1 py-3 text-center">Soporte</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div id="seccionSolicitudes">
                    <div id="listaMudanzas" class="space-y-4"></div>
                </div>
                <div id="seccionTraslados" style="display:none;" class="space-y-4">
                    <h2 class="font-bold text-base text-slate-800 mb-2">🚀 Mudanzas Aprobadas</h2>
                    <div id="listaTrasladosAprobados" class="space-y-4"></div>
                </div>
                
                <!-- SECCIÓN BILLETERA FLETERO -->
                <div id="seccionBilletera" style="display:none;" class="space-y-6">
                    <h2 class="font-bold text-xl text-slate-900">Billetera de Fletero</h2>
                    <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg space-y-2">
                        <div class="text-xs text-slate-400 font-medium">Saldo Disponible para Retiro</div>
                        <div class="text-3xl font-extrabold tracking-tight">ARS 0.00</div>
                    </div>
                    <div class="space-y-3">
                        <h3 class="font-bold text-sm text-slate-700">Métodos de Cobro Asociados</h3>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="bg-blue-100 text-blue-800 p-2 rounded-lg font-bold text-xs">🏦</span>
                                <span class="font-semibold text-sm text-slate-800">CBU / CVU Bancario</span>
                            </div>
                            <span class="text-slate-400 font-bold">›</span>
                        </div>
                    </div>
                </div>

                <div id="seccionPerfil" style="display:none;" class="space-y-4">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-base text-slate-800">👤 Mi Perfil y Datos Bancarios</h2>
                        <button onclick="cerrarSesion()" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Cerrar Sesión</button>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 text-sm">
                        <div>
                            <label class="text-slate-500 text-xs font-semibold block mb-1">NOMBRE</label>
                            <input type="text" id="perfilNombreInput" class="w-full p-2 border rounded-lg text-sm bg-white">
                        </div>
                        <div>
                            <label class="text-slate-500 text-xs font-semibold block mb-1">CORREO</label>
                            <input type="email" id="perfilEmailInput" class="w-full p-2 border rounded-lg text-sm bg-white">
                        </div>
                        <button onclick="guardarPerfilFletero()" class="w-full bg-slate-900 text-white p-2 rounded-lg text-sm font-semibold mt-2">Guardar</button>
                    </div>
                </div>

                <div id="seccionSoporte" style="display:none;" class="space-y-4">
                    <h2 class="font-bold text-base text-slate-800">📞 Soporte Técnico</h2>
                    <p class="text-sm text-slate-500">Comunícate ante cualquier inconveniente.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
            ? "http://127.0.0.1:8000" 
            : "https://fletes-app.onrender.com";

        let fleteroIdActual = sessionStorage.getItem("fleteroId");

        function cambiarTabAuth(tab) {
            const loginDiv = document.getElementById("subTabFletero-login");
            const regDiv = document.getElementById("subTabFletero-registro");
            const btnLogin = document.getElementById("btnTabLogin");
            const btnReg = document.getElementById("btnTabRegistro");
            if (tab === 'login') {
                loginDiv.style.display = "block"; regDiv.style.display = "none";
                btnLogin.classList.add("border-slate-900", "text-slate-900"); btnLogin.classList.remove("text-slate-500");
                btnReg.classList.remove("border-slate-900", "text-slate-900"); btnReg.classList.add("text-slate-500");
            } else {
                regDiv.style.display = "block"; loginDiv.style.display = "none";
                btnReg.classList.add("border-slate-900", "text-slate-900"); btnReg.classList.remove("text-slate-500");
                btnLogin.classList.remove("border-slate-900", "text-slate-900"); btnLogin.classList.add("text-slate-500");
            }
        }

        async function ejecutarLogin() {
            const res = await fetch(`${API_URL}/fleteros/login`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({email: document.getElementById("loginEmail").value, password: document.getElementById("loginPassword").value})});
            const data = await res.json();
            if(res.ok) { 
                fleteroIdActual = data.fletero.id; 
                sessionStorage.setItem("fleteroId", fleteroIdActual); 
                sessionStorage.setItem("datosFletero", JSON.stringify(data.fletero));
                location.reload(); 
            } else { alert("Error al iniciar sesión"); }
        }

        async function ejecutarRegistroFletero() {
            try {
                const data = {
                    nombre: document.getElementById("regNombre").value,
                    telefono: document.getElementById("regTelefono").value,
                    email: document.getElementById("regEmail").value,
                    password: document.getElementById("regPassword").value,
                    vehiculo: document.getElementById("regVehiculo").value,
                    patente: document.getElementById("regPatente").value,
                    cbu_cvu: document.getElementById("regCbuCvu").value,
                    alias_bancario: document.getElementById("regAlias").value,
                    nombre_banco: document.getElementById("regBanco").value
                };
                const res = await fetch(`${API_URL}/fleteros/`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                if (res.ok) { alert("¡Registro exitoso!"); cambiarTabAuth('login'); }
                else { alert("Error al registrarse"); }
            } catch (err) {}
        }

        async function cargarDatosDashboard() {
            const [resM, resO] = await Promise.all([fetch(`${API_URL}/mudanzas/`), fetch(`${API_URL}/ofertas/`)]);
            const mudanzas = await resM.json();
            const ofertas = await resO.json();
            
            const cont = document.getElementById("listaMudanzas");
            const contTraslados = document.getElementById("listaTrasladosAprobados");
            if (cont) cont.innerHTML = "";
            if (contTraslados) contTraslados.innerHTML = "";

            const eliminadasSol = JSON.parse(localStorage.getItem(`fletero_sol_eliminadas_${fleteroIdActual}`) || "[]");
            const eliminadasTras = JSON.parse(localStorage.getItem(`fletero_tras_eliminadas_${fleteroIdActual}`) || "[]");
            const aprobadasPorFletero = JSON.parse(localStorage.getItem(`fletero_aprobadas_manual_${fleteroIdActual}`) || "[]");

            let arrayAprobadas = [];

            for (const m of mudanzas) {
                let nombreCliente = `Cliente ID: ${m.cliente_id}`;
                let telefonoCliente = "No disponible";
                let calificacionCliente = "⭐⭐⭐⭐⭐ (5.0)";
                
                try {
                    let resCliente = await fetch(`${API_URL}/usuarios/${m.cliente_id}`);
                    if (!resCliente.ok) resCliente = await fetch(`${API_URL}/clientes/${m.cliente_id}`);
                    if (resCliente.ok) {
                        const cliData = await resCliente.json();
                        const clienteObj = cliData.cliente || cliData;
                        nombreCliente = clienteObj.nombre || nombreCliente;
                        telefonoCliente = clienteObj.telefono || telefonoCliente;
                    }
                } catch(e) {}

                let fechaOriginal = "", horaOriginal = "";
                let textoCargaReal = m.descripcion_carga;
                let fechaOrdenKey = "9999-12-31", horaOrdenKey = "23:59";

                const matchFecha = m.descripcion_carga.match(/\[Fecha: (.*?) - (.*?)\]/);
                if (matchFecha) {
                    fechaOriginal = matchFecha[1]; horaOriginal = matchFecha[2];
                    fechaOrdenKey = matchFecha[1]; horaOrdenKey = matchFecha[2];
                    textoCargaReal = m.descripcion_carga.replace(matchFecha[0], "").trim();
                }

                const ofertaAceptadaCliente = ofertas.find(o => o.mudanza_id == m.id && o.fletero_id == fleteroIdActual && (o.estado === 'aceptada' || o.estado === 'aprobada'));

                if (aprobadasPorFletero.includes(m.id)) {
                    if (eliminadasTras.includes(m.id)) continue;
                    const montoAcordado = ofertaAceptadaCliente ? ofertaAceptadaCliente.monto_oferta : '0';
                    const estaPagado = m.estado_pago === "pagado"; 
                    
                    let contactoClienteHtml = estaPagado ? `<a href="https://wa.me/${telefonoCliente.replace(/\D/g, '')}" target="_blank" class="text-emerald-700 font-bold underline">💬 WhatsApp (${telefonoCliente})</a>` : `<span class="text-amber-700 italic">🔒 Oculto hasta que el cliente abone</span>`;
                    const estadoPagoHtml = estaPagado ? '<span class="bg-emerald-200 text-emerald-900 px-2 py-1 rounded text-xs font-bold">🔒 Pago Retenido</span>' : '<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs">⏳ Pendiente</span>';

                    arrayAprobadas.push({
                        timestamp: new Date(`${fechaOrdenKey}T${horaOrdenKey}`).getTime(),
                        html: `
                            <div id="tarjeta_traslado_${m.id}" class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-3 text-sm relative">
                                <button onclick="eliminarTarjetaAprobada(${m.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-500 text-xs font-bold bg-white px-1">✕</button>
                                <div class="font-bold text-emerald-900">🚀 Mudanza #${m.id}</div>
                                <div class="bg-white p-2 rounded border text-xs">👤 <strong>Cliente:</strong> ${nombreCliente} | 📞 ${contactoClienteHtml}</div>
                                <div class="text-xs">📍 Origen: ${m.origen_direccion} ➔ Destino: ${m.destino_direccion}</div>
                                <div class="flex justify-between text-xs pt-1"><span>💰 $${montoAcordado}</span> ${estadoPagoHtml}</div>
                            </div>`
                    });
                } else {
                    if (eliminadasSol.includes(m.id)) continue;
                    const ofertasDeEstaMudanza = ofertas.filter(o => o.mudanza_id == m.id && o.fletero_id == fleteroIdActual);
                    let htmlOfertasCargadas = "";
                    if (ofertasDeEstaMudanza.length > 0) {
                        const ultimaOferta = ofertasDeEstaMudanza[ofertasDeEstaMudanza.length - 1];
                        let estadoUltima = (ultimaOferta.estado === 'aceptada' || ultimaOferta.estado === 'aprobada') ?
                            `<button onclick="aprobarTrasladoFletero(${m.id}, ${ultimaOferta.id})" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold">Aprobar</button>` :
                            `<button onclick="cambiarEstado(${ultimaOferta.id}, 'cancelada')" class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px]">Cancelar</button>`;
                        htmlOfertasCargadas = `<div class="mt-2 border-t pt-1 text-xs">Oferta: $${ultimaOferta.monto_oferta} ${estadoUltima}</div>`;
                    }

                    cont.innerHTML += `
                        <div id="tarjeta_mudanza_${m.id}" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 text-sm relative">
                            <button onclick="eliminarTarjeta(${m.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-500 text-xs font-bold bg-white px-1">✕</button>
                            <div class="font-bold text-slate-900">📦 Solicitud #${m.id}</div>
                            <div class="text-xs space-y-1"><div>📍 De: ${m.origen_direccion}</div><div>🏁 A: ${m.destino_direccion}</div><div>📋 ${textoCargaReal}</div></div>
                            <div class="grid grid-cols-3 gap-2 pt-2 border-t">
                                <input type="number" id="monto_${m.id}" class="p-1 border rounded text-xs bg-white" placeholder="Monto ($)">
                                <input type="time" id="hora_${m.id}" class="p-1 border rounded text-xs bg-white" value="${horaOriginal}">
                                <button onclick="enviarOferta(${m.id})" class="bg-slate-900 text-white p-1 rounded text-xs font-semibold">Ofertar</button>
                            </div>
                            ${htmlOfertasCargadas}
                        </div>`;
                }
            }

            arrayAprobadas.sort((a, b) => a.timestamp - b.timestamp);
            arrayAprobadas.forEach(item => { if(contTraslados) contTraslados.innerHTML += item.html; });
        }

        async function aprobarTrasladoFletero(mudanzaId, ofertaId) {
            const aprobadas = JSON.parse(localStorage.getItem(`fletero_aprobadas_manual_${fleteroIdActual}`) || "[]");
            if (!aprobadas.includes(mudanzaId)) { aprobadas.push(mudanzaId); localStorage.setItem(`fletero_aprobadas_manual_${fleteroIdActual}`, JSON.stringify(aprobadas)); }
            await fetch(`${API_URL}/ofertas/${ofertaId}/aceptar`, { method: "PUT", headers: { "Content-Type": "application/json" } });
            cargarDatosDashboard();
        }

        function cambiarTabDashboard(s) { 
            document.getElementById("seccionSolicitudes").style.display = s==='solicitudes' ? 'block' : 'none';
            document.getElementById("seccionTraslados").style.display = s==='traslados' ? 'block' : 'none';
            document.getElementById("seccionBilletera").style.display = s==='billetera' ? 'block' : 'none';
            document.getElementById("seccionPerfil").style.display = s==='perfil' ? 'block' : 'none';
            document.getElementById("seccionSoporte").style.display = s==='soporte' ? 'block' : 'none';

            ['navSolicitudes', 'navTraslados', 'navBilletera', 'navPerfil', 'navSoporte'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.classList.remove("border-b-2", "border-emerald-400", "font-semibold");
            });
            if(s==='solicitudes') document.getElementById("navSolicitudes").classList.add("border-b-2", "border-emerald-400", "font-semibold");
            if(s==='traslados') { document.getElementById("navTraslados").classList.add("border-b-2", "border-emerald-400", "font-semibold"); cargarDatosDashboard(); }
            if(s==='billetera') document.getElementById("navBilletera").classList.add("border-b-2", "border-emerald-400", "font-semibold");
            if(s==='perfil') document.getElementById("navPerfil").classList.add("border-b-2", "border-emerald-400", "font-semibold");
            if(s==='soporte') document.getElementById("navSoporte").classList.add("border-b-2", "border-emerald-400", "font-semibold");
        }

        async function enviarOferta(mId) {
            const monto = document.getElementById(`monto_${mId}`).value;
            const hora = document.getElementById(`hora_${mId}`).value;
            if(!monto) return alert("Ingresa un monto");
            await fetch(`${API_URL}/ofertas/`, { 
                method: "POST", headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ mudanza_id: mId, fletero_id: parseInt(fleteroIdActual), monto_oferta: parseFloat(monto), tiempo_estimado: hora ? `Hora prop: ${hora}` : "1.5" })
            });
            cargarDatosDashboard();
        }

        function eliminarTarjeta(mId) { document.getElementById(`tarjeta_mudanza_${mId}`)?.remove(); }
        function eliminarTarjetaAprobada(mId) { document.getElementById(`tarjeta_traslado_${mId}`)?.remove(); }
        function cerrarSesion() { sessionStorage.clear(); location.reload(); }

        if(fleteroIdActual) { 
            document.getElementById("pantallaAuth").style.display="none"; 
            document.getElementById("pantallaDashboard").style.display="flex"; 
            cargarDatosDashboard(); 
        }
    </script>
</body>
</html>
